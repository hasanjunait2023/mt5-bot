name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tooling
        run: pip install -r requirements-dev.txt --quiet
      - name: Tests (gate before deploy)
        run: python -m pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            echo "==> Pulling latest code..."
            git pull origin master

            echo "==> Installing Python dependencies..."
            /opt/mt5-venv/bin/pip install -r requirements-server.txt --quiet

            echo "==> Building frontend..."
            cd dashboard/frontend
            npm ci --silent
            npm run build
            cd ../..

            echo "==> Restarting services..."
            systemctl --no-block restart mt5-dashboard mt5-telegram
            echo "==> Deploy complete!"
