# ── Central service registry ──────────────────────────────────────────────────
# Single source of truth for every process the MT5 bot runs.
# The orchestrator (trading_agents/orchestrator.py) reads this, starts each
# enabled service in dependency order, health-checks it, and auto-restarts on
# death. This REPLACES the old competing launchers (bot_launcher.ps1, start_bot.ps1,
# start_jtcc_agents.ps1, register_startup_tasks.ps1).
#
# health.type:
#   http   → GET url, healthy if status < 400          (infra with an endpoint)
#   tcp    → connect to port, healthy if it accepts     (servers without /health)
#   file   → state file mtime younger than max_age secs (agents that write state)
#   process→ just "is the child process alive"          (fire-and-loop agents)
#
# group: logical subsystem — mt5 | tv | core. Lets us reason about the two
#   subsystems (MT5 trading vs TradingView) independently. (Informational +
#   future per-group control.)
# profiles: which deployment(s) run this service. The orchestrator keeps a
#   service only if DEPLOYMENT_MODE (default "vps") is in its profiles
#   (default ["vps"]). So the VPS runs everything; a machine started with
#   DEPLOYMENT_MODE=local runs only services tagged with "local" (none by
#   default → local PC stays a dev/standby box, no live agents).

defaults:
  restart:
    enabled: true
    max_retries: 5          # consecutive failures before giving up + alerting
    backoff_seconds: 15
  health_interval: 30       # seconds between health sweeps

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  - id: bridge
    name: MT5 Bridge (api_server)
    group: mt5
    # MetaTrader5 PyPI package is Windows-only. Linux VPS launches the bridge
    # via wine-staging python (wrapper script sets WINEPREFIX/DISPLAY/PYTHONPATH).
    # The same module-name still works on a Windows VPS — keep both profiles so
    # the [vps] entry doesn't lose supervision if the host ever flips back.
    profiles: [vps, linux]
    cmd: [bash, scripts/launch_bridge_wine.sh]
    health: {type: http, url: "http://localhost:8090/health"}
    critical: true

  - id: dashboard
    name: Dashboard backend (hub/signals/alpha)
    group: core
    profiles: [vps, linux]
    cmd: [python, -m, uvicorn, "main:app", --host, "0.0.0.0", --port, "8010"]
    cwd: dashboard/backend
    health: {type: tcp, port: 8000}
    depends_on: [bridge]

  # ── MT5 system — Trading agents (health = their state file staying fresh) ────
  - id: mtf_live
    name: MTF Live Trader
    group: mt5
    # Refactored to talk to MT5 via the HTTP bridge (mt5_bridge.bridge_client
    # shim), so it runs on native Linux python — no direct MetaTrader5 import.
    profiles: [vps, linux]   # enabled after 4G swap added 2026-06-02 (bridge-HTTP shim)
    cmd: [python, "mt5_bridge/mtf_live_trader.py", --pairs,
          CADJPY, EURJPY, USDJPY, GBPAUD, BTCUSD, AUDNZD, USDCAD, EURUSD, AUDCHF,
          NZDUSD, EURNZD, NZDJPY, AUDCAD, GBPJPY, AUDUSD, AUDJPY, GBPUSD, XAUUSD,
          --risk, "1.0", --dd, "20.0", --maxdd, "50.0", --maxtd, "6"]
    # Cold start is slow: loop sleeps to next bar (~60s) then runs a synchronous
    # NVIDIA heartbeat (retries up to ~150s) before its first state write. Give it
    # room so the supervisor doesn't restart it mid-startup.
    # Writes once per loop, BEFORE scanning 18 symbols x 3 TFs. The first scan on a
    # cold MT5 connection downloads history per symbol and can take minutes, so writes
    # are sparse early. 600s max_age tolerates that without a false restart loop.
    health: {type: file, path: "mt5_bridge/_live_state.json", max_age: 600, grace: 300}
    depends_on: [bridge]

  - id: jtcc
    name: JTCC ICT/SMC
    group: mt5
    # JTCC talks to MT5 over HTTP (jtcc/execution/mt5_client.py → :8090), so it
    # runs on native Linux python — no wine needed here.
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.jtcc.main]
    health: {type: file, path: "logs/jtcc/_jtcc_state.json", max_age: 300}
    depends_on: [bridge]

  - id: jtcc_guardian
    name: JTCC Guardian
    group: mt5
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.jtcc.guardian, --interval, "60"]
    health: {type: file, path: "logs/jtcc/_guardian_state.json", max_age: 300}
    depends_on: [jtcc]

  - id: jtcc_coach
    name: JTCC Coach
    group: mt5
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.jtcc.coach, --loop, --interval, "6"]
    health: {type: process}
    depends_on: [jtcc]

  - id: jtcc_digest
    name: JTCC Digest
    group: mt5
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.jtcc.digest, --loop]
    health: {type: process}

  - id: iconic
    name: Iconic Scalp
    group: mt5
    # Refactored to bridge HTTP (mt5_bridge.bridge_client shim) — native Linux.
    profiles: [vps, linux]   # enabled after 4G swap added 2026-06-02 (bridge-HTTP shim)
    cmd: [python, -m, trading_agents.iconic.agent, --risk, "1.0", --dd, "6.0"]
    health: {type: file, path: "logs/iconic/_agent_state.json", max_age: 600}
    depends_on: [bridge]

  - id: scalp_gs11
    name: Gold Scalp (GS11/GS07)
    group: mt5
    # Refactored to bridge HTTP (mt5_bridge.bridge_client shim) — native Linux.
    profiles: [vps, linux]   # enabled after 4G swap added 2026-06-02 (bridge-HTTP shim)
    cmd: [python, -m, trading_agents.scalp.agent, --risk, "1.0", --dd, "5.0"]
    health: {type: file, path: "logs/scalp/_agent_state.json", max_age: 600}
    depends_on: [bridge]

  - id: gsvp
    name: GS-VP Volume Profile (M15)
    group: mt5
    # Adaptive volume-profile (breakout-retest + VA-reversion). Trades the demo
    # account via the bridge HTTP shim (no MetaTrader5 import). Demo → real orders;
    # a non-demo account would fail-closed to simulate without --allow-real.
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.scalp.gsvp_agent,
          --symbols, GBPUSD, EURUSD, XAUUSD, BTCUSD, XAGUSD,
          --risk, "1.0", --dd, "6.0"]
    health: {type: file, path: "logs/scalp/_gsvp_agent_state.json", max_age: 600, grace: 120}
    depends_on: [bridge]

  - id: asia_fade
    name: Asia Desk (Asian Range Fade)
    group: mt5
    # Asian-session mean reversion on JPY pairs. Validated 2.1yr M15 real-cost:
    # USDJPY PF 1.60/oos 1.46, AUDJPY 1.47/oos 1.40 (non-JPY had no edge).
    # Trades 02:00-07:00 UTC, flattens before London. See trading_agents/asia_desk/.
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.asia_desk.agent,
          --pairs, USDJPY, AUDJPY, --risk, "0.5"]
    health: {type: file, path: "logs/asia_desk/_state.json", max_age: 1200, grace: 120}
    depends_on: [bridge]

  # ── Strategy Factory (YouTube → research → codegen → backtest → demo soak) ────
  - id: factory_runner
    name: Strategy Factory Runner
    group: core
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.factory.runner, --loop, --interval, "45"]
    health: {type: file, path: "logs/factory/_runner_state.json", max_age: 300}
    depends_on: [bridge]

  - id: factory_paper
    name: Strategy Factory Paper Soak
    group: mt5
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.factory.paper_runner]
    health: {type: file, path: "logs/factory/_soak_state.json", max_age: 600}
    depends_on: [bridge]

  # ── CEO / control ────────────────────────────────────────────────────────────
  # Single Telegram inbound poller for the whole system (telegram_bot.py). Running
  # a second poller on the same token (e.g. maic_telegram_bot.py) anywhere causes
  # a getUpdates 409 — keep this the ONLY one.
  - id: maic_bot
    name: Maic CEO Telegram Bot
    group: core
    profiles: [vps, linux]
    cmd: [python, telegram_bot.py]
    health: {type: process}
    depends_on: [bridge]

  # ── Management / improvement loop (were idle — now supervised) ───────────────
  - id: ea_guardian
    name: EA Guardian (anomaly watchdog)
    group: mt5
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.ea_agents.ea_guardian]
    health: {type: process}
    depends_on: [bridge]

  - id: ea_coach
    name: EA Coach (6h improvement)
    group: mt5
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.ea_agents.ea_coach, --loop]
    health: {type: process}

  - id: supervisor
    name: Supervisor (12h system audit)
    group: core
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.supervisor_agent, --interval, "12"]
    health: {type: process}

  # Full autonomous growth loop: collect ideas (Scout) → backtest (StrategyResearcher)
  # → rank vs PF/consistency thresholds → pitch winners to Maic CEO + auto-write a
  # JTCC YAML stub → observe downstream EA build/validate. Persists the funnel to
  # _scout_state.json. This REPLACES the bare strategy_scout loop, which only
  # brainstormed ideas to Telegram and discarded them (no backtest/persist).
  - id: growth_pipeline
    name: Strategy Growth Pipeline (discover→backtest→pitch)
    group: core
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.strategy_scout.growth_pipeline, --interval, "8"]
    # 8h cycle; max_age 9h (32400s) tolerates a full cycle + LLM/backtest latency.
    health: {type: file, path: "trading_agents/strategy_scout/_scout_state.json", max_age: 32400, grace: 600}
    depends_on: [bridge]

  # ── TV system — TradingView chart analysis agents ────────────────────────────
  # Drive the tradingview-mcp desktop directly (CDP). Need TradingView running +
  # logged in. Health = state-file freshness (agents heartbeat every ~120s while
  # idle between scheduled runs).
  - id: tv_intraday
    name: TV Intraday Analyst (day-trade)
    group: tv
    profiles: [vps, linux]   # enabled 2026-06-03 (TV snap+CDP+MCP on VPS)
    cmd: [python, -m, trading_agents.tv_desk.intraday_analyst, --loop]
    health: {type: file, path: "logs/intraday_analyst/_state.json", max_age: 400, grace: 120}

  - id: tv_scalper
    name: TV Session Scalper
    group: tv
    profiles: [vps, linux]   # enabled 2026-06-03 (TV snap+CDP+MCP on VPS)
    cmd: [python, -m, trading_agents.tv_desk.session_scalper, --loop]
    health: {type: file, path: "logs/session_scalper/_state.json", max_age: 400, grace: 120}

  # Keeps the VPS TradingView session alive. TradingView paid plans allow ONE
  # active session; logging in elsewhere bumps the VPS → chart shows "Reconnect".
  # This detects that and reconnects, unless paused (so the user can use TV on
  # their own device). See trading_agents/tv_desk/connection_watchdog.py.
  - id: tv_connection_watchdog
    name: TV Connection Watchdog
    group: tv
    profiles: [vps, linux]   # enabled 2026-06-03 (TV snap+CDP+MCP on VPS)
    cmd: [python, -m, trading_agents.tv_desk.connection_watchdog, --loop, --interval, "45"]
    health: {type: file, path: "logs/tv_watchdog/_state.json", max_age: 180, grace: 120}

  # Keeps MT5 "Algo Trading" enabled — it resets to OFF on every terminal
  # restart/crash, and while OFF all orders are rejected (retcode 10027). Polls
  # the bridge trade_allowed flag and sends Ctrl+E to the MT5 window when needed.
  - id: autotrading_guard
    name: AutoTrading Guard
    group: mt5
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.autotrading_guard, --loop, --interval, "60"]
    health: {type: file, path: "logs/autotrading_guard/_state.json", max_age: 240, grace: 120}
    depends_on: [bridge]

  # ── Analytics / improvement intelligence ────────────────────────────────────
  # Builds the strategy scorecard (verdict + per-strategy P&L + failure/strength +
  # improvement queue) from the live journal every 15 min → logs/_strategy_scorecard.json.
  # Consumed by the CEO agent, the dashboard Strategy Performance page, EOD review,
  # and the Phase 5 improvement loop. Runs loss_analyzer + win_analyzer internally.
  - id: analytics
    name: Strategy Scorecard / Analytics
    group: core
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.strategy_scorecard, --loop, --interval, "15"]
    health: {type: file, path: "logs/_strategy_scorecard.json", max_age: 1200, grace: 180}
    depends_on: [bridge]

  # ── Reporting ────────────────────────────────────────────────────────────────
  - id: daily_digest
    name: Daily Digest
    group: core
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.daily_digest, --loop]
    health: {type: process}

  # EOD daily trade report — at 23:00 BD (17:00 UTC) sends a Telegram digest of
  # every trade today (per agent + strategy), wins/losses, WHY each loss, and the
  # day's overall result. Built from the cross-agent trade_journal.
  - id: daily_trade_report
    name: EOD Daily Trade Report (23:00 BD)
    group: core
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.daily_trade_report, --loop]
    health: {type: file, path: "logs/daily_trade_report/_state.json", max_age: 100000, grace: 300}
    depends_on: [bridge]

  # EOD diagnostic review — per-strategy scorecard + LLM improvement proposals to
  # Telegram, daily after NY close.
  - id: eod_review
    name: EOD Strategy Review
    group: core
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.eod_review, --loop]
    health: {type: file, path: "logs/eod_review/_state.json", max_age: 100000, grace: 300}
    depends_on: [bridge, analytics]

  # Improvement loop (Phase 5 north star) — for each LOSING strategy in the
  # scorecard's improvement_queue: diagnose (mistakes + wins) + research → propose a
  # bounded change → Telegram for HUMAN approval (apply stays manual + promotion_gate).
  # Never kills/demotes; iterates toward profitability. Every 6h.
  - id: improvement_loop
    name: Strategy Improvement Loop
    group: core
    profiles: [vps, linux]
    cmd: [python, -m, trading_agents.improvement_loop, --loop, --interval, "360"]
    health: {type: file, path: "logs/_improvement/_state.json", max_age: 30000, grace: 300}
    depends_on: [analytics]

  # ── Meta-monitoring ──────────────────────────────────────────────────────────
  # Watches every file-health agent above: if a state file goes stale past its
  # max_age (work no longer progressing), it records the agent to
  # logs/_stalled_agents.json and the "Stalled agents" section of PENDING.md.
  # Pure monitoring — never touches trading. See scripts/pending_tracker.py.
  - id: pending_tracker
    name: Pending / Stalled-agent Tracker
    group: core
    profiles: [vps, linux]
    cmd: [python, scripts/pending_tracker.py, --loop, --interval, "300"]
    health: {type: process}
