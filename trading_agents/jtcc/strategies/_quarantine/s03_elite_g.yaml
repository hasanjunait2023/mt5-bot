name: "Elite G"
version: 1.0
description: "HA+EMA+MACD+ADX Gold D1 — 75% WR. Full indicator confluence."
symbols: [XAUUSD, XAGUSD]
timeframe: D1

entry_rules:
  buy:
    - "momentum.ha_bull is true"
    - "momentum.ha_streak >= 3"
    - "momentum.ema20_above_50 is true"
    - "momentum.ema50_above_200 is true"
    - "momentum.adx >= 25"
    - "momentum.macd_hist > 0"
    - "news.blocked is false"
  sell:
    - "momentum.ha_bear is true"
    - "momentum.ha_streak >= 3"
    - "momentum.ema20_above_50 is false"
    - "momentum.ema50_above_200 is false"
    - "momentum.adx >= 25"
    - "momentum.macd_hist < 0"
    - "news.blocked is false"

exit_rules:
  sl_method: "swing_low"
  tp_method: "rr"
  sl_buffer_pips: 50
  min_rr: 2.0

risk:
  max_trades_per_day: 1
  confidence_required: 7
