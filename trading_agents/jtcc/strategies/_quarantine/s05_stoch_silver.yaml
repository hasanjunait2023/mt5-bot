name: "Stoch Silver MM1"
version: 1.0
description: "MM#1 Deep Stochastic + EMA + HA — Silver D1 80% WR."
symbols: [XAGUSD]
timeframe: D1

entry_rules:
  buy:
    - "momentum.stoch_oversold is true"
    - "momentum.ema20_above_50 is true"
    - "momentum.ema50_above_200 is true"
    - "momentum.ha_bull is true"
    - "news.blocked is false"
  sell:
    - "momentum.stoch_overbought is true"
    - "momentum.ema20_above_50 is false"
    - "momentum.ema50_above_200 is false"
    - "momentum.ha_bear is true"
    - "news.blocked is false"

exit_rules:
  sl_method: "swing_low"
  tp_method: "rr"
  sl_buffer_pips: 50
  min_rr: 2.0

risk:
  max_trades_per_day: 1
  confidence_required: 7
