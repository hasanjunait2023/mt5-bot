name: "Liquidity Sweep Reversal"
version: 1.1
description: "SSL/BSL sweep reversal M5. KEEP-DEMO: high PF (2.11-2.87) but tiny sample (2-3 trades). Promising, needs more data. XAU removed (0 trades)."
symbols: [EURUSD, GBPUSD, USDJPY]
timeframe: M5
backtest:
  source: trading_agents/jtcc/backtest_jtcc.py
  date: 2026-05-21
  results:
    EURUSD: {trades: 2, wr_pct: 50.0, pf: 2.11, verdict: INSUFFICIENT}
    GBPUSD: {trades: 2, wr_pct: 50.0, pf: 2.86, verdict: INSUFFICIENT}
    USDJPY: {trades: 3, wr_pct: 33.3, pf: 1.08, verdict: INSUFFICIENT}
  disabled:
    XAUUSD: {trades: 0, reason: "MSS+sweep confluence never aligned on XAU M5"}
  notes: "High PF on tiny sample. Keep in demo to accumulate trades before promote/disable decision."

entry_rules:
  buy:
    - "smc.sweep_detected is true"
    - "smc.sweep_type == SSL_SWEEP"
    - "session.primary is true"
    - "market.mss is true"
    - "news.blocked is false"
    - "risk.can_trade is true"
  sell:
    - "smc.sweep_detected is true"
    - "smc.sweep_type == BSL_SWEEP"
    - "session.primary is true"
    - "market.mss is true"
    - "news.blocked is false"
    - "risk.can_trade is true"

exit_rules:
  sl_method: "sweep_low"
  tp_method: "rr"
  sl_buffer_pips: 3
  min_rr: 2.0

risk:
  max_trades_per_day: 2
  confidence_required: 7
