name: "CPP Confluence Pullback"
version: 2.0
description: "CPP strategy — strict pullback to EMA200. RESTRICTED to EURUSD per 2026-05-21 backtest_jtcc.py (26 trades, PF 1.22 marginal). GBPUSD/USDJPY UNPROFITABLE removed."
symbols: [EURUSD]
timeframe: H1
backtest:
  source: trading_agents/jtcc/backtest_jtcc.py
  date: 2026-05-21
  walked_bars: 5000 H1 bars (~9 months)
  results:
    EURUSD: {trades: 26, wr_pct: 42.3, pf: 1.22, max_dd: 0.021, verdict: MARGINAL}
  disabled:
    GBPUSD: {trades: 27, wr_pct: 29.6, pf: 0.58, verdict: UNPROFITABLE}
    USDJPY: {trades: 20, wr_pct: 20.0, pf: 0.33, max_dd: 5.55, verdict: UNPROFITABLE}
  notes: "Original claim 'PF 1.84 on USDJPY' refuted. Only EUR survives, and marginally."

entry_rules:
  buy:
    - "market.trend == BULLISH"
    - "momentum.price_above_ema200 is true"
    - "momentum.ema50_above_200 is true"
    - "momentum.rsi < 50"
    - "momentum.stoch_oversold is true"
    - "session.primary is true"
    - "news.blocked is false"
    - "risk.can_trade is true"
  sell:
    - "market.trend == BEARISH"
    - "momentum.price_above_ema200 is false"
    - "momentum.ema50_above_200 is false"
    - "momentum.rsi > 50"
    - "momentum.stoch_overbought is true"
    - "session.primary is true"
    - "news.blocked is false"
    - "risk.can_trade is true"

exit_rules:
  sl_method: "swing_low"
  tp_method: "rr"
  sl_buffer_pips: 8
  min_rr: 2.0

risk:
  max_trades_per_day: 2
  confidence_required: 6
