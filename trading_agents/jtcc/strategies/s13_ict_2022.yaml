entry_rules:
  buy:
    - "market.trend == BULLISH"
    - "session.primary is true"
    - "smc.sweep_detected is true"
    - "smc.sweep_type == SSL_SWEEP"
    - "market.mss is true"
    - "smc.bull_fvg_count > 0"
    - "smc.in_ote is true"
    - "news.blocked is false"
    - "risk.can_trade is true"
  sell:
    - "market.trend == BEARISH"
    - "session.primary is true"
    - "smc.sweep_detected is true"
    - "smc.sweep_type == BSL_SWEEP"
    - "market.mss is true"
    - "smc.bear_fvg_count > 0"
    - "smc.in_ote is true"
    - "news.blocked is false"
    - "risk.can_trade is true"

exit_rules:
  sl_method: "sweep_low"
  tp_method: "liquidity_pool"
  sl_buffer_pips: 5
  min_rr: 2.0

risk:
  max_trades_per_day: 2
  confidence_required: 8
